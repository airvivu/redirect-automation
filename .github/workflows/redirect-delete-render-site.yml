name: Redirect — delete Render site

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: "Render service ID (srv-…)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Python deps
        run: pip install -r automation/scripts/requirements.txt

      - name: Delete on Render + registry
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python automation/scripts/delete_site.py --service-id "${{ inputs.service_id }}"

      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/sites-registry.json
          git diff --staged --quiet || git commit -m "chore(automation): remove Render site from registry"
          git push
