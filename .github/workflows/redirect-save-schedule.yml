name: Redirect — save schedule

on:
  workflow_dispatch:
    inputs:
      github_repo:
        description: "GitHub repo (owner/name)"
        required: true
        type: string
      branch:
        required: false
        default: "main"
        type: string
      build_command:
        required: false
        default: "echo Static HTML — no build step"
        type: string
      publish_path:
        required: false
        default: "."
        type: string
      create_interval_minutes:
        description: "Create every N minutes (10–60, step 5)"
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "15"
          - "20"
          - "25"
          - "30"
          - "35"
          - "40"
          - "45"
          - "50"
          - "55"
          - "60"
      delete_lifetime_minutes:
        description: "Delete Render sites older than N minutes (not active)"
        required: true
        default: "15"
        type: choice
        options:
          - "10"
          - "15"
          - "20"
          - "25"
          - "30"
          - "35"
          - "40"
          - "45"
          - "50"
          - "55"
          - "60"
      enabled:
        description: "Enable automatic rotation"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write schedule.json
        env:
          ENABLED: ${{ inputs.enabled }}
          REPO: ${{ inputs.github_repo }}
          BRANCH: ${{ inputs.branch }}
          BUILD: ${{ inputs.build_command }}
          PUBLISH: ${{ inputs.publish_path }}
          CREATE_EVERY: ${{ inputs.create_interval_minutes }}
          DELETE_AFTER: ${{ inputs.delete_lifetime_minutes }}
        run: |
          python <<'PY'
          import json, os
          path = "automation/schedule.json"
          enabled = os.environ["ENABLED"] == "true"
          data = {
            "enabled": enabled,
            "github_repo": os.environ["REPO"],
            "branch": os.environ["BRANCH"],
            "build_command": os.environ["BUILD"],
            "publish_path": os.environ["PUBLISH"],
            "create_interval_minutes": int(os.environ["CREATE_EVERY"]),
            "delete_lifetime_minutes": int(os.environ["DELETE_AFTER"]),
            "last_create_at": None,
            "next_create_at": None,
          }
          with open(path, "w") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          PY

      - uses: webfactory/ssh-agent@v0.9.0
        if: inputs.enabled == 'true'
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Python deps
        if: inputs.enabled == 'true'
        run: pip install -r automation/scripts/requirements.txt

      - name: Cleanup old Render sites
        if: inputs.enabled == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python automation/scripts/cleanup.py

      - name: Rotate immediately (auto on)
        if: inputs.enabled == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
        run: |
          python automation/scripts/rotate.py \
            --repo "${{ inputs.github_repo }}" \
            --branch "${{ inputs.branch }}" \
            --build-command "${{ inputs.build_command }}" \
            --publish-path "${{ inputs.publish_path }}"
          python automation/scripts/finish_schedule_after_rotate.py

      - name: Commit schedule and registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/schedule.json automation/sites-registry.json
          git diff --staged --quiet || git commit -m "chore(automation): save schedule and registry"
          git push
